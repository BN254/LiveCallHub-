
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>LiveCallHub - Live Photos</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #000;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  min-height: 100vh;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 5px;
  padding: 5px;
}

.photo {
  position: relative;
  overflow: hidden;
  background: #151515;
  border-radius: 8px;
  aspect-ratio: 4 / 3;
}

.photo img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.live-badge {
  position: absolute;
  top: 9px;
  left: 9px;
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 8px;
  border-radius: 5px;
  background: #ff202b;
  color: #fff;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .5px;
  box-shadow: 0 2px 8px #0005;
}

.live-badge::before {
  content: "";
  display: inline-block;
  width: 7px;
  height: 7px;
  background: #fff;
  border-radius: 50%;
}

.online-dot {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 13px;
  height: 13px;
  background: #00e676;
  border-radius: 50%;
  box-shadow: 0 0 9px #00e676, 0 0 18px #00e67688;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0%, 100% {
    opacity: 1;
    transform: scale(1);
  }
  50% {
    opacity: .55;
    transform: scale(.82);
  }
}

@media (min-width: 700px) {
  .gallery {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    padding: 8px;
  }

  .photo {
    border-radius: 9px;
  }

  .live-badge {
    font-size: 14px;
    padding: 6px 10px;
  }

  .online-dot {
    width: 15px;
    height: 15px;
  }
}

@media (max-width: 350px) {
  .gallery {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
