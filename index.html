
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveCallHub Photos</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #000;
  font-family: Arial, sans-serif;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 3px;
}

.gallery img {
  display: block;
  width: 100%;
  height: 230px;
  object-fit: cover;
}

@media (min-width: 700px) {
  .gallery {
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }

  .gallery img {
    height: 300px;
  }
}
</style>
</head>
