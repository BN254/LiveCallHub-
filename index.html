
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>LiveCallHub</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050b16;color:white;font-family:Arial,sans-serif;min-height:100vh}
button{border:0;cursor:pointer;font-weight:bold;font-size:16px}
.screen{display:none;min-height:100vh}
.screen.active{display:flex}

/* WELCOME */
#welcome{align-items:center;justify-content:center;text-align:center;padding:25px;
background:radial-gradient(circle,#173a49,#050b16 70%)}
.welcome-box{max-width:420px}
.logo{font-size:36px;font-weight:800;margin-bottom:20px}
.logo span{color:#32d5bd}
.welcome-box p{color:#b5c3d4;margin:12px 0 25px}
.loader{width:42px;height:42px;border:4px solid #263b4c;
border-top-color:#32d5bd;border-radius:50%;animation:spin .8s linear infinite;margin:25px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* INCOMING CALL */
#incoming{align-items:center;justify-content:center;padding:20px;
background:radial-gradient(circle,#173a49,#050b16 75%)}
.call-card{width:100%;max-width:390px;text-align:center}
.call-card h2{font-size:26px;margin:20px 0 8px}
.calling{color:#34d9bf;margin-bottom:20px}
.caller-photo{position:relative;width:100%;aspect-ratio:3/4;
max-height:470px;background:#172536;border-radius:22px;overflow:hidden}
.caller-photo img{width:100%;height:100%;object-fit:cover}
.live{position:absolute;top:12px;left:12px;background:#ff2638;
color:white;border-radius:5px;padding:6px 9px;font-size:12px;font-weight:800}
.live:before{content:"";display:inline-block;width:7px;height:7px;
background:white;border-radius:50%;margin-right:5px}
.dot{position:absolute;top:15px;right:15px;width:13px;height:13px;
background:#00ef76;border-radius:50%;box-shadow:0 0 12px #00ef76;
animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.45;transform:scale(.8)}}
.call-actions{display:flex;justify-content:center;gap:20px;margin-top:28px}
.call-actions button{padding:15px 25px;border-radius:35px;color:white;min-width:135px}
.answer{background:#00bd68}
.decline{background:#ed3045}

/* GALLERY */
#gallery-screen{display:none}
#gallery-screen.active{display:block}
.gallery-header{position:sticky;top:0;z-index:5;background:#07111f;
padding:15px;text-align:center;border-bottom:1px solid #243344}
.gallery-header h2{font-size:22px}
.gallery-header span{color:#32d5bd}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;padding:5px}
.photo{position:relative;aspect-ratio:3/4;overflow:hidden;background:#142131;border-radius:7px}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .live{top:8px;left:8px}
.photo .dot{top:11px;right:11px;width:11px;height:11px}
#ended{align-items:center;justify-content:center;text-align:center;padding:25px}
#ended h2{margin-bottom:15px}
#ended p{color:#b5c3d4;margin-bottom:25px}
.action-button{background:#32d5bd;color:#041714;padding:13px 24px;border-radius:10px}

@media(min-width:700px){
.gallery{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:8px}
.call-card{max-width:420px}
}
</style>
</head>

<body>

<!-- WELCOME SCREEN -->
<section id="welcome" class="screen active">
  <div class="welcome-box">
    <div class="logo">LiveCall<span>Hub</span></div>
    <h1>Welcome to LiveCallHub</h1>
    <p>Connecting people. One call at a time.</p>
    <div class="loader"></div>
    <p>Preparing your experience...</p>
  </div>
</section>

<!-- INCOMING VIDEO CALL SCREEN -->
<section id="incoming" class="screen">
  <div class="call-card">
    <div class="logo">LiveCall<span>Hub</span></div>
    <div class="caller-photo">
      <img id="callerImage" src="" alt="Incoming caller">
      <span class="live">LIVE</span>
      <span class="dot"></span>
    </div>
    <h2>Incoming Video Call</h2>
    <p class="calling">Someone is calling you...</p>
    <div class="call-actions">
      <button class="decline" id="declineBtn">Decline</button>
      <button class="answer" id="answerBtn">Answer</button>
    </div>
  </div>
</section>

<!-- LIVE PHOTO GALLERY -->
<section id="gallery-screen" class="screen">
  <header class="gallery-header">
    <h2>LiveCall<span>Hub</span> — LIVE Photos</h2>
  </header>
  <main class="gallery" id="photoGallery"></main>
</section>

<!-- CALL DECLINED SCREEN -->
<section id="ended" class="screen">
  <div>
    <h2>Call Ended</h2>
    <p>You declined the incoming call.</p>
    <button class="action-button" id="nextCallBtn">Incoming Call Again</button>
  </div>
</section>

<script>
(() => {
  "use strict";

  const photos = [
    "IMG-20261024-WA0003.jpg",
    "IMG-20261025-WA0001.jpg",
    "IMG-20261025-WA0002.jpg",
    "IMG-20261025-WA0003.jpg",
    "IMG-20261025-WA0004.jpg",
    "IMG-20261025-WA0005.jpg",
    "IMG-20261025-WA0006.jpg",
    "IMG-20261025-WA0007.jpg",
    "IMG-20261025-WA0008.jpg",
    "IMG-20261025-WA0009.jpg",
    "IMG-20261025-WA0010.jpg",
    "IMG-20261025-WA0011.jpg",
    "IMG-20261025-WA0012.jpg"
  ];

  const screens = [
    "welcome",
    "incoming",
    "gallery-screen",
    "ended"
  ];

  const showScreen = id => {
    screens.forEach(screenId => {
      document.getElementById(screenId).classList.toggle(
        "active", screenId === id
      );
    });
  };

  // Shuffle without repeating a caller photo within one cycle.
  function shuffledPhotos() {
    const list = [...photos];

    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }

    return list;
  }

  // Remember the caller rotation on this device.
  function getQueue() {
    try {
      const saved = JSON.parse(localStorage.getItem("lchCallQueue"));
      if (Array.isArray(saved) &&
          saved.every(name => photos.includes(name))) {
        return saved;
      }
    } catch (_) {}

    return [];
  }

  let queue = getQueue();
  let currentCaller = null;

  function nextCaller() {
    if (queue.length === 0) {
      queue = shuffledPhotos();
    }

    currentCaller = queue.shift();

    try {
      localStorage.setItem("lchCallQueue", JSON.stringify(queue));
    } catch (_) {}

    document.getElementById("callerImage").src = currentCaller;
    showScreen("incoming");
  }

  // Create the gallery using all available photos.
  const gallery = document.getElementById("photoGallery");

  photos.forEach((filename, index) => {
    const card = document.createElement("div");
    card.className = "photo";

    const img = document.createElement("img");
    img.src = filename;
    img.alt = "Live photo " + (index + 1);
    img.loading = "lazy";

    const badge = document.createElement("span");
    badge.className = "live";
    badge.textContent = "LIVE";

    const dot = document.createElement("span");
    dot.className = "dot";

    card.append(img, badge, dot);
    gallery.appendChild(card);
  });

  document.getElementById("answerBtn").addEventListener("click", () => {
    showScreen("gallery-screen");
  });

  document.getElementById("declineBtn").addEventListener("click", () => {
    showScreen("ended");
  });

  document.getElementById("nextCallBtn").addEventListener("click", () => {
    nextCaller();
  });

  // Welcome page remains visible for three seconds.
  setTimeout(nextCaller, 3000);

})();
</script>

</body>
</html>
